{% extends 'appointments/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Editar Agendamento</h3>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form.date_time.label_tag }}
                        {{ form.date_time }}
                        <!-- Exibe os erros de validação da data -->
                        {% if form.date_time.errors %}
                            <div class="text-danger small mt-1">
                                {% for error in form.date_time.errors %}
                                    {{ error }}
                                {% endfor %}
                            </div>
                        {% endif %}
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">{{ form.services.label }}</label>
                        <div class="border p-3 rounded bg-light">
                            {{ form.services }}
                        </div>
                    </div>

                    <button type="submit" class="btn btn-warning w-100">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
